<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Chicago skyline from Lake Michigan, cycling from morning to night">
  <!-- One 30 s day: dawn (0) → noon (.25) → sunset (.5) → night (.65–.9) → dawn (1). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"><animate attributeName="stop-color" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#6b7fb8;#3f8bdc;#3a2b6e;#070b1f;#070b1f;#6b7fb8"/></stop>
      <stop offset=".6"><animate attributeName="stop-color" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#f0a48c;#8cc6f2;#e6676a;#141a3d;#141a3d;#f0a48c"/></stop>
      <stop offset="1"><animate attributeName="stop-color" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#ffd7a3;#d4ecfc;#ffb067;#262b55;#262b55;#ffd7a3"/></stop>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"><animate attributeName="stop-color" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#c98f86;#5d9fd6;#a3536a;#0d1330;#0d1330;#c98f86"/></stop>
      <stop offset="1"><animate attributeName="stop-color" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#4d5a8c;#2a6aa8;#3a2650;#04061a;#04061a;#4d5a8c"/></stop>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff6c8"/><stop offset=".55" stop-color="#ffd24d"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon"><stop offset="0" stop-color="#fbfbf2"/><stop offset=".6" stop-color="#e6e6d8"/><stop offset="1" stop-color="#e6e6d8" stop-opacity="0"/></radialGradient>
    <pattern id="winA" width="9" height="11" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="2" height="3" fill="#ffd56b"/>
    </pattern>
    <pattern id="winB" width="13" height="17" patternUnits="userSpaceOnUse">
      <rect x="8" y="9" width="2" height="3" fill="#fff1c2"/><rect x="3" y="3" width="2" height="3" fill="#ffc94a" opacity=".7"/>
    </pattern>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff2b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></linearGradient>
    <clipPath id="above"><rect width="1200" height="280"/></clipPath>
    <!-- the reflection is drawn flipped: local y 200–280 lands on the lake -->
    <clipPath id="below"><rect y="200" width="1200" height="80"/></clipPath>

    <!-- Skyline seen from the lake, west on the left. Base line y = 280. -->
    <g id="city">
      <!-- low fill -->
      <path d="M0 280V238h30v-12h28v20h22v-34h26v26h24v-18h20v56zM110 280v-60h30v60zM640 280v-70h24v-14h26v84zM700 280v-52h30v-20h22v72zM805 280v-66h20v66zM855 280v-90h28v90zM890 280v-58h26v-16h22v74zM930 280v-40h20v40z"/>
      <!-- 311 S Wacker with its crown -->
      <path d="M150 280V128h35v152zM157 128v-16h21v16zM162 112v-8h11v8z"/>
      <!-- Willis Tower and antennas -->
      <path d="M200 280V118h16V84h16V58h28v34h18v188z"/>
      <rect x="236" y="18" width="2.4" height="40"/><rect x="252" y="26" width="2.4" height="32"/>
      <!-- filler -->
      <path d="M283 280V150h26v130zM312 280v-96h22v96z"/>
      <!-- Marina City corn cobs -->
      <rect x="337" y="168" width="15" height="112" rx="7"/><rect x="355" y="168" width="15" height="112" rx="7"/>
      <!-- Trump Tower and spire -->
      <path d="M376 280V122h10V96h10V70h14v28h10v182z"/><rect x="401" y="34" width="2" height="36"/>
      <!-- Tribune Tower -->
      <path d="M424 280V176l4-6v-8h3l2-7 2 7h3v8l4 6v104z"/>
      <!-- Two Prudential with its spire -->
      <path d="M452 280V118l16-26 16 26v162z"/><rect x="467" y="62" width="2" height="30"/>
      <!-- Aon Center -->
      <rect x="492" y="66" width="38" height="214"/>
      <!-- Blue Cross / filler -->
      <path d="M536 280V140h30v140z"/>
      <!-- St. Regis -->
      <path d="M572 280V100c6-6 10-6 14 0s8 6 14 0v180z"/>
      <!-- Hancock: tapered, two antennas -->
      <path d="M752 280l10-212h30l10 212z"/>
      <rect x="768" y="24" width="2.4" height="44"/><rect x="784" y="30" width="2.4" height="38"/>
      <!-- Palmolive with its beacon mast -->
      <path d="M830 280V164l6-8h12l6 8v116z"/><rect x="841" y="132" width="2" height="24"/>
      <!-- Lake Point Tower -->
      <path d="M958 280V150c0-6 4-8 8-8h28c4 0 8 2 8 8v130z"/>
      <!-- Navy Pier -->
      <rect x="1010" y="274" width="190" height="6"/><rect x="1150" y="258" width="40" height="16"/>
    </g>
  </defs>

  <rect width="1200" height="280" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.5;.62;.9;.97;1" values="0;0;1;1;0;0"/>
    <circle cx="60" cy="40" r="1.2"/><circle cx="140" cy="90" r=".9"/><circle cx="310" cy="30" r="1.1"/>
    <circle cx="430" cy="60" r=".8"/><circle cx="560" cy="25" r="1.3"><animate attributeName="opacity" dur="2.3s" repeatCount="indefinite" values="1;.3;1"/></circle>
    <circle cx="660" cy="80" r="1"/><circle cx="720" cy="35" r=".9"/><circle cx="880" cy="55" r="1.2"><animate attributeName="opacity" dur="3.1s" repeatCount="indefinite" values=".4;1;.4"/></circle>
    <circle cx="940" cy="20" r=".8"/><circle cx="1010" cy="95" r="1"/><circle cx="1090" cy="40" r="1.3"/><circle cx="1160" cy="75" r=".9"/>
    <circle cx="200" cy="12" r=".8"/><circle cx="820" cy="110" r=".7"/><circle cx="1130" cy="130" r=".8"><animate attributeName="opacity" dur="1.7s" repeatCount="indefinite" values="1;.2;1"/></circle>
  </g>

  <!-- sun (rises over the lake, sets in the west) and moon -->
  <circle r="34" fill="url(#sun)">
    <animateMotion dur="30s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.56;1" path="M1150 330Q640 -170 60 330"/>
  </circle>
  <circle r="16" fill="url(#moon)">
    <animateMotion dur="30s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;.56;1" path="M1150 330Q700 -120 120 330"/>
  </circle>

  <!-- clouds, gone at night -->
  <g fill="#fff">
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.62;.92;1" values=".55;.85;.45;0;0;.55"/>
    <g><animateTransform attributeName="transform" type="translate" dur="60s" repeatCount="indefinite" values="-200 0;1300 0"/>
      <ellipse cx="0" cy="70" rx="46" ry="11"/><ellipse cx="26" cy="62" rx="26" ry="12"/></g>
    <g><animateTransform attributeName="transform" type="translate" dur="85s" repeatCount="indefinite" values="500 0;1400 0;-300 0;500 0" keyTimes="0;.53;.53;1"/>
      <ellipse cx="0" cy="120" rx="60" ry="10"/><ellipse cx="-20" cy="113" rx="28" ry="10"/></g>
  </g>

  <!-- city: silhouette colour by hour, then two layers of office lights -->
  <g clip-path="url(#above)">
    <use href="#city" xlink:href="#city">
      <animate attributeName="fill" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#3e4766;#55657f;#2a2342;#0b0d1b;#0b0d1b;#3e4766"/>
    </use>
    <use href="#city" xlink:href="#city" fill="url(#winA)" opacity="0">
      <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.06;.45;.6;.9;1" values=".3;0;0;.85;.7;.3"/>
    </use>
    <use href="#city" xlink:href="#city" fill="url(#winB)" opacity="0">
      <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.04;.52;.64;.84;.95;1" values=".15;0;0;.9;.9;.15;.15"/>
    </use>
  </g>

  <!-- antenna beacons -->
  <g fill="#ff3b3b">
    <circle cx="237.2" cy="18" r="2"><animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0;1"/></circle>
    <circle cx="253.2" cy="26" r="2"><animate attributeName="opacity" dur="1.6s" begin=".8s" repeatCount="indefinite" values="1;0;1"/></circle>
    <circle cx="769.2" cy="24" r="2"><animate attributeName="opacity" dur="1.9s" repeatCount="indefinite" values="1;0;1"/></circle>
    <circle cx="785.2" cy="30" r="2"><animate attributeName="opacity" dur="1.9s" begin=".9s" repeatCount="indefinite" values="1;0;1"/></circle>
    <circle cx="402" cy="34" r="1.6"><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0;1;0"/></circle>
  </g>
  <!-- Palmolive's Lindbergh beacon sweeping at night -->
  <path d="M842 132L960 116L960 140Z" fill="url(#beam)" opacity="0">
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.55;.65;.9;.95;1" values="0;0;.5;.5;0;0"/>
    <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" values="0 842 132;-25 842 132;0 842 132;25 842 132;0 842 132"/>
  </path>

  <!-- Navy Pier Ferris wheel -->
  <g transform="translate(1100 226)">
    <g stroke-width="1.6" fill="none">
      <animate attributeName="stroke" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#3e4766;#55657f;#2a2342;#1a1d33;#1a1d33;#3e4766"/>
      <line x1="-14" y1="48" x2="0" y2="0"/><line x1="14" y1="48" x2="0" y2="0"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="24s" repeatCount="indefinite" values="0;360"/>
      <circle r="30" fill="none" stroke-width="2.2">
        <animate attributeName="stroke" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#3e4766;#55657f;#2a2342;#ff5fa2;#ff5fa2;#3e4766"/>
      </circle>
      <g stroke-width="1">
        <animate attributeName="stroke" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#3e4766;#55657f;#2a2342;#7fd3ff;#7fd3ff;#3e4766"/>
        <line x1="-30" y1="0" x2="30" y2="0"/><line x1="0" y1="-30" x2="0" y2="30"/>
        <line x1="-21" y1="-21" x2="21" y2="21"/><line x1="-21" y1="21" x2="21" y2="-21"/>
      </g>
    </g>
  </g>

  <!-- airplane crossing at dusk -->
  <g opacity="0">
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.5;.55;.85;.9;1" values="0;0;1;1;0;0"/>
    <circle r="1.6" fill="#fff"><animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;.1;1"/>
      <animateMotion dur="30s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.52;.9;1" path="M1220 60L-20 105"/></circle>
  </g>

  <!-- Lake Michigan with the city's reflection -->
  <rect y="280" width="1200" height="80" fill="url(#lake)"/>
  <g clip-path="url(#below)" opacity=".35" transform="translate(0 560) scale(1 -1)">
    <use href="#city" xlink:href="#city">
      <animate attributeName="fill" dur="30s" repeatCount="indefinite" keyTimes="0;.25;.5;.65;.9;1" values="#3e4766;#55657f;#2a2342;#0b0d1b;#0b0d1b;#3e4766"/>
    </use>
    <use href="#city" xlink:href="#city" fill="url(#winA)" opacity="0">
      <animate attributeName="opacity" dur="30s" repeatCount="indefinite" keyTimes="0;.06;.45;.6;.9;1" values=".3;0;0;.85;.7;.3"/>
    </use>
  </g>
  <g stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".25">
    <line x1="80" y1="296" x2="140" y2="296"><animate attributeName="x1" dur="5s" repeatCount="indefinite" values="80;110;80"/></line>
    <line x1="300" y1="310" x2="380" y2="310"><animate attributeName="x2" dur="4s" repeatCount="indefinite" values="380;340;380"/></line>
    <line x1="520" y1="300" x2="560" y2="300"><animate attributeName="x1" dur="6s" repeatCount="indefinite" values="520;540;520"/></line>
    <line x1="760" y1="318" x2="840" y2="318"><animate attributeName="x2" dur="5s" repeatCount="indefinite" values="840;800;840"/></line>
    <line x1="980" y1="304" x2="1030" y2="304"><animate attributeName="x1" dur="4.5s" repeatCount="indefinite" values="980;1000;980"/></line>
    <line x1="200" y1="336" x2="300" y2="336"><animate attributeName="x2" dur="7s" repeatCount="indefinite" values="300;250;300"/></line>
    <line x1="640" y1="342" x2="740" y2="342"><animate attributeName="x1" dur="6s" repeatCount="indefinite" values="640;680;640"/></line>
  </g>
</svg>
